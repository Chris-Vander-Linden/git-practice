<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BBB Rumors</title>

    <style>
      :root {
        --bg: --fg: #000000;
        --muted: #292929;
        --accent: #646464;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        background-color: rgba(182, 192, 210, 0.5);
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--fg);
      }

      main {
        max-width: 720px;
        margin: 0 auto;
      }

      header {
        position: absolute;
        padding-left: 5px;
      }

      #main-image-container {
        width: 100%;
        margin: 10px auto;
        position: relative;
      }

      #content {
        position: absolute;
        bottom: 0;
        right: 0;
        padding: 5px;
      }

      img {
        width: 100%;
      }
    </style>
  </head>

  <body>
    <main>
      <div id="main-image-container">
        <header>
          <h1>BBB Rumors</h1>
          <p>pst... pst... pst...</p>
        </header>
        <img
          src="./image/FE827BD8-22DC-43B3-853B-BD98BDCC83D1_1_105_c.jpeg"
          alt="snow"
        />
        <div id="content">
          <h2>03.20.26</h2>
        </div>
      </div>
    </main>
  </body>
</html>
