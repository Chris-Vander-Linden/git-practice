<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BBB Rumors</title>

    <style>
      :root {
        --bg: #ffffff;
        --fg: #000000;
        --muted: #292929;
        --accent: #646464;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.6;
      }

      main {
        max-width: 720px;
        padding: 2rem;
        margin: 0 auto;
      }

      header {
        margin-bottom: 2rem;
        border-bottom: 1px solid #1e293b;
        padding-bottom: 1rem;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
      }

      p {
        color: var(--muted);
      }

      ul {
        padding-left: 1.2rem;
      }

      li {
        margin: 0.5rem 0;
      }

      footer {
        margin-top: 3rem;
        font-size: 0.9rem;
        color: var(--muted);
        border-top: 1px solid #1e293b;
        padding-top: 1rem;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <main>
      <header>
        <h1>BBB Rumors</h1>
        <p>pst...</p>
      </header>

      <section>
        <h2>Rumors</h2>
        <ul>
          <li>1</li>
          <li>2</li>
          <li>3</li>
        </ul>
      </section>

      <section>
        <h2>Notes</h2>
        <p>
          Lorem ipsum dolor, sit amet consectetur adipisicing elit. Deserunt eveniet iste nam. Doloremque, ullam. Magni sunt ab ullam rerum. Quasi autem quo, sed nihil labore animi vitae est in a.
        </p>
      </section>

      <footer>
        <p>
          Maintained by <strong>Chris</strong> ·
          <a href="#">GitHub</a>
        </p>
      </footer>
    </main>
  </body>
</html>
